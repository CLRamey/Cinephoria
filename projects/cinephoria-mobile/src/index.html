    <base href="/" />

      name="description"
      content="Cinéphoria vous permet de réserver des films en ligne, consulter les séances."

    <meta

      content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000;"
