<ion-content [fullscreen]="true" class="home-background">
  <div id="container">
    <img src="./assets/logo.webp" alt="Cinéphoria Logo" class="logo-image" loading="eager" />
    <h1>Bienvenue !</h1>
    <p>La passerelle vers le monde du cinéma vous attend.</p>
    <ion-button

      size="large"
      color="dark"

  </div>
</ion-content>
